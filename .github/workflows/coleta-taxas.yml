name: Coleta de taxas

# A cada ~15 dias (dias 1 e 16 às 06:00 UTC) + execução manual pela aba Actions.
on:
  schedule:
    - cron: '0 6 1,16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo teste (coleta e mostra, sem gravar no Xano)'
        type: boolean
        default: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Rodar coleta de taxas
        env:
          XANO_BASE_URL: ${{ secrets.XANO_BASE_URL }}
          COLETA_SECRET: ${{ secrets.COLETA_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/coleta-taxas/index.mjs
